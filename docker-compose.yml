services:
  postgres:
    image: postgres:16-alpine
    container_name: pricetracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-price_tracker}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d price_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: pricetracker_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/price_tracker
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
